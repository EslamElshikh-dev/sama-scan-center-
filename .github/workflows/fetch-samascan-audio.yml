name: Fetch Sama Scan Audio

on:
  push:
    branches:
      - main

# Temporary one-run workflow used only to materialize generated Arabic audio.
jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated Arabic audio
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://resource2.heygen.ai/text_to_speech/10bb3ef56d634e949fc9e84c0d2bf81d/46daee8d4d0042b184a6ce903014ac18/id=6dd8b11f-2be5-4f91-abdb-ea01d39c75d3.wav' -o patient.wav
          curl -L --fail --retry 3 'https://resource2.heygen.ai/text_to_speech/10bb3ef56d634e949fc9e84c0d2bf81d/b61e9d5acad544c8a0cb791d3c9decf9/id=abd3808b-421e-41ed-86b7-d3cb91e0d81b.wav' -o doctor.wav
          ls -lh patient.wav doctor.wav
      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: samascan-audio
          path: |
            patient.wav
            doctor.wav
          retention-days: 1
