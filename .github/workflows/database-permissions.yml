name: PostgreSQL 17 explicit-permission acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fresh schema, original SQL assertions and actual PostgREST calls
        run: python3 tests/integration/supabase17/run.py
      - name: Service diagnostics on failure
        if: failure()
        run: docker compose -f tests/integration/supabase17/compose.yml logs --tail=60 db rest
      - name: Remove isolated services and data
        if: always()
        run: docker compose -f tests/integration/supabase17/compose.yml down --volumes --remove-orphans
