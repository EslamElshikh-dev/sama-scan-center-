# Versions reused from the already-accepted directory/Tawod stacks.
name: samascan-permission-acceptance
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: isolated-permissions-db-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:13000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:isolated-permissions-rest-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: isolated-permissions-acceptance-never-production-20261026
